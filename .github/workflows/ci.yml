# Name of the workflow shown in GitHub's Actions tab
name: CI Pipeline

# When to run this workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# What to do
jobs:
  test:
    # Use a fresh Linux machine provided by GitHub (free)
    runs-on: ubuntu-latest

    steps:
      # 1. Get a copy of our code from the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python 3.13
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. Cache pip to make future runs faster
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # 4. Install our project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # 5. Run our tests
      - name: Run tests
        run: pytest test_api.py -v